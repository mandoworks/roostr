name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./verify.sh
      - name: Headless smoke and load tests
        run: node --test test/headless.test.js test/load.test.js
      - name: Load numbers
        run: node scripts/load-test.js

name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches the manifest
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml | head -1)
          test "v$manifest" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match herdr-plugin.toml version $manifest"
            exit 1
          }
      - run: ./verify.sh
      - name: Build the release archive
        run: |
          git archive --format=tar.gz --prefix="roostr-$GITHUB_REF_NAME/" \
            -o "roostr-$GITHUB_REF_NAME.tar.gz" HEAD
          sha256sum "roostr-$GITHUB_REF_NAME.tar.gz" > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "roostr-$GITHUB_REF_NAME.tar.gz" SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "roostr-$GITHUB_REF_NAME.tar.gz" SHA256SUMS \
              --title "roostr $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

  feed:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Attach plugin manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          commit=$(git rev-parse "$tag^{commit}")
          mkdir -p dist
          gh release download "$tag" --pattern 'roostr-*.tar.gz' --dir dist --clobber
          sha=$(sha256sum dist/roostr-*.tar.gz | awk '{print $1}')
          released=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > plugin.json <<EOF
          {
            "schema": 1,
            "id": "roostr",
            "version": "$version",
            "minHerdrVersion": "0.9.1",
            "commit": "$commit",
            "tag": "$tag",
            "releasedAt": "$released",
            "install": "herdr plugin install mandoworks/roostr --ref $tag",
            "repo": "https://github.com/mandoworks/roostr",
            "release": "https://github.com/mandoworks/roostr/releases/tag/$tag",
            "tarball": "https://github.com/mandoworks/roostr/releases/download/$tag/roostr-$tag.tar.gz",
            "sha256": "$sha"
          }
          EOF
          gh release upload "$tag" plugin.json --clobber

name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches the manifest
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml | head -1)
          test "v$manifest" = "$GITHUB_REF_NAME" || {
            echo "tag $GITHUB_REF_NAME does not match herdr-plugin.toml version $manifest"
            exit 1
          }
      - run: ./verify.sh
      - name: Build the release archive
        run: |
          git archive --format=tar.gz --prefix="crew-board-$GITHUB_REF_NAME/" \
            -o "crew-board-$GITHUB_REF_NAME.tar.gz" HEAD
          sha256sum "crew-board-$GITHUB_REF_NAME.tar.gz" > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "crew-board-$GITHUB_REF_NAME.tar.gz" SHA256SUMS \
            --title "crew-board $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

  feed:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update the plugin feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          commit=$(git rev-parse "$tag^{commit}")
          gh release download "$tag" --pattern 'crew-board-*.tar.gz' --dir dist --clobber
          sha=$(sha256sum dist/crew-board-*.tar.gz | awk '{print $1}')
          released=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > web/plugin.json <<EOF
          {
            "schema": 1,
            "id": "crew-board",
            "version": "$version",
            "minHerdrVersion": "0.9.1",
            "commit": "$commit",
            "tag": "$tag",
            "releasedAt": "$released",
            "install": "herdr plugin install mandoworks/crew-board --ref $tag",
            "repo": "https://github.com/mandoworks/crew-board",
            "release": "https://github.com/mandoworks/crew-board/releases/tag/$tag",
            "tarball": "https://github.com/mandoworks/crew-board/releases/download/$tag/crew-board-$tag.tar.gz",
            "sha256": "$sha"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/plugin.json
          if git diff --cached --quiet; then
            echo "plugin feed already current"
            exit 0
          fi
          git commit -m "Release $tag feed"
          git pull --rebase origin main
          git push origin HEAD:main
